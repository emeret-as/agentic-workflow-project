[project]
name = "agentic-workflow-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.6"
dependencies = [
    "accelerate>=1.15.0",
    "chainlit>=2.12.0",
    "datasets>=4,<5",
    "gcsfs>=2025.7.0",
    "google-cloud-aiplatform>=2.3.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.16.0",
    "ipykernel>=7.4.0",
    "kfp>=2.17.0",
    "langchain-community==0.4.1",
    "langfuse>=3,<4",
    "pandas>=3.0.6",
    "peft==0.13.2",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.33.0",
    "rouge-score>=0.1.2",
    "streamlit==1.67.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "transformers==4.46.*",
    "trl>=0.17.0",
]

[project.scripts]
agentic-workflow-project = "agentic_workflow_project:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
