[project]
name = "agentic-workflow-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.6"
dependencies = [
    "datasets>=5.1.0",
    "gcsfs>=2026.8.1",
    "google-cloud-aiplatform>=2.3.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.16.0",
    "kfp>=2.17.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-workflow-project = "agentic_workflow_project:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
